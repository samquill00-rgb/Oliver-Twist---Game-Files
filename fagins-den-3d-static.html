<!DOCTYPE html>
<html lang="en">
<head>

<title>Fagin's Den — Field Lane, Saffron Hill</title>
<style>

body { background: #000; overflow: hidden; }
canvas { display: block; }
#datestamp {
  position: absolute; top: 18px; right: 24px;
  font: 14px monospace; color: rgba(200,140,60,0.5);
  pointer-events: none;
}
#location {
  position: absolute; bottom: 18px; left: 50%;
  transform: translateX(-50%);
  font: 12px 'Courier New', monospace; color: rgba(200,180,140,0.4);

}
</style>
</head>
<body>
<div id="datestamp">SAFFRON HILL, 1837</div>
<div id="location">FAGIN'S DEN, FIELD LANE</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/BokehShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/BokehPass.js"></script>
<script>
// ====== dssScene — REUSABLE 3D ATMOSPHERE TOOLKIT ===========
// ============================================================
// Procedural materials and props extracted from the Chippy /
// Pillars / Lackland scenes so new 3D approach scenes can pull
// the same Soho-night look without re-deriving every texture.
//
// Usage (inside a scene IIFE, after THREE is loaded):
//   var brickMat = dssScene.makeGrimyBrick({ baseColor: 0x7a5a48 });
//   var roadMat  = dssScene.makeGrimyRoad();
//   var paveMat  = dssScene.makePavingSlabs();
//   var stucco   = dssScene.makeWeatheredStucco();
//   dssScene.createVictorianGasLamp(scene, -4, 3.5);
//   var btn = dssScene.createEnterButton('ENTER THE SOMEWHERE',
//     function() { /* nav handler */ });
//   wrap.appendChild(btn);
//
// All `make*` factories return a THREE.MeshStandardMaterial with
// `map`/`repeat` set, ready to apply to geometry. `create*`
// factories build a THREE.Group (or DOM element) and add it for
// you when given a parent.
// ------------------------------------------------------------
window.dssScene = (function() {

  // ---------- canvas texture helper ----------
  function makeCanvasTexture(w, h, drawFunc) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var cx = c.getContext('2d');
    drawFunc(cx, w, h);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  // ---------- GRIMY BRICK ----------
  // Running-bond brickwork with mortar courses, soot streaks,
  // damp/lichen patches, paste-up ghost, top soot wash.
  // opts:
  //   baseColor:  fill rgb (default 0x6f4f3a)
  //   repeat:     [u, v] tiling (default [2, 4])
  //   sootStreaks: count (default 5)
  //   dampPatches: count (default 5)
  //   lichen:      count (default 12)
  //   highlightBricks: count of brighter-painted bricks (default 8)
  function makeGrimyBrick(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x6f4f3a).toString(16).padStart(6, '0');
    var streaks = opts.sootStreaks != null ? opts.sootStreaks : 5;
    var damp    = opts.dampPatches != null ? opts.dampPatches : 5;
    var lichen  = opts.lichen      != null ? opts.lichen      : 12;
    var highlights = opts.highlightBricks != null ? opts.highlightBricks : 8;
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var bH = 14, bW = 32;
      for (var by = 0; by < h; by += bH) {
        var rowOff = ((Math.floor(by / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var bx = -bW; bx < w + bW; bx += bW) {
          var px = bx + rowOff;
          var r = 95 + Math.floor(Math.random() * 50);
          var g = 60 + Math.floor(Math.random() * 35);
          var b = 45 + Math.floor(Math.random() * 30);
          if (Math.random() > 0.94) { r -= 40; g -= 32; b -= 22; }
          if (Math.random() > 0.96) { r += 30; g += 18; b += 10; }
          cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
          cx.fillRect(px + 1, by + 1, bW - 2, bH - 2);
          cx.fillStyle = 'rgba(20,12,6,' + (0.05 + Math.random() * 0.10).toFixed(3) + ')';
          cx.fillRect(px + 1, by + bH - 3, bW - 2, 2);
        }
      }
      cx.fillStyle = 'rgba(170, 145, 115, 0.32)';
      for (var hy = 0; hy < h; hy += bH) cx.fillRect(0, hy, w, 1);
      cx.fillStyle = 'rgba(160, 135, 105, 0.22)';
      for (var hyy = 0; hyy < h; hyy += bH) {
        var ro = ((Math.floor(hyy / bH)) % 2 === 0) ? 0 : bW / 2;
        for (var hxx = ro; hxx < w; hxx += bW) cx.fillRect(hxx, hyy, 1.4, bH);
      }
      for (var ss = 0; ss < streaks; ss++) {
        var sx = Math.random() * w;
        var sxw = 12 + Math.random() * 30;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(8, 6, 4, 0.55)');
        sg.addColorStop(0.3, 'rgba(12, 10, 6, 0.32)');
        sg.addColorStop(0.7, 'rgba(18, 14, 9, 0.12)');
        sg.addColorStop(1, 'rgba(22, 18, 10, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < damp; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.45 + Math.random() * h * 0.55;
        var dr = 30 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(60, 75, 55, 0.32)');
        dg2.addColorStop(0.5, 'rgba(50, 60, 45, 0.16)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      for (var lp = 0; lp < lichen; lp++) {
        cx.fillStyle = 'rgba(95, 105, 60, ' + (0.10 + Math.random() * 0.18).toFixed(3) + ')';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          5 + Math.random() * 12, 3 + Math.random() * 6.6,
          Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var topG = cx.createLinearGradient(0, 0, 0, h * 0.45);
      topG.addColorStop(0, 'rgba(18, 12, 8, 0.42)');
      topG.addColorStop(1, 'rgba(18, 12, 8, 0)');
      cx.fillStyle = topG; cx.fillRect(0, 0, w, h * 0.45);
      cx.fillStyle = 'rgba(220, 200, 160, 0.08)';
      cx.fillRect(w * 0.12, h * 0.42, w * 0.18, h * 0.13);
      for (var hl = 0; hl < highlights; hl++) {
        var hbx = Math.floor(Math.random() * (w / bW)) * bW;
        var hby = Math.floor(Math.random() * (h / bH)) * bH;
        cx.fillStyle = 'rgba(220, 195, 150, ' + (0.10 + Math.random() * 0.15).toFixed(3) + ')';
        cx.fillRect(hbx + 1, hby + 1, bW - 2, 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92 });
  }

  // ---------- WEATHERED STUCCO ----------
  // Cream stucco with hairline cracks, nicotine wash pooling
  // lower, soot streaks from gutters, damp/green patches, paint-
  // patch repairs, paste-up ghost, bird splat.
  // opts:
  //   baseColor: default 0xc8b89a
  //   repeat:    default [2, 3]
  function makeWeatheredStucco(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0xc8b89a).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var pp = 0; pp < 350; pp++) {
        var b = 180 + Math.floor(Math.random() * 30);
        cx.fillStyle = 'rgba(' + b + ',' + (b - 18) + ',' + (b - 32) + ',0.12)';
        cx.beginPath();
        cx.ellipse(Math.random() * w, Math.random() * h,
          6 + Math.random() * 24, 4 + Math.random() * 14, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      var nicoG = cx.createLinearGradient(0, h * 0.35, 0, h);
      nicoG.addColorStop(0, 'rgba(170, 145, 80, 0)');
      nicoG.addColorStop(0.6, 'rgba(170, 145, 80, 0.10)');
      nicoG.addColorStop(1, 'rgba(160, 130, 60, 0.18)');
      cx.fillStyle = nicoG; cx.fillRect(0, h * 0.35, w, h * 0.65);
      for (var ss = 0; ss < 6; ss++) {
        var sx = Math.random() * w;
        var sxw = 10 + Math.random() * 26;
        var sg = cx.createLinearGradient(sx, 0, sx, h);
        sg.addColorStop(0, 'rgba(15, 12, 8, 0.50)');
        sg.addColorStop(0.4, 'rgba(20, 16, 10, 0.22)');
        sg.addColorStop(0.85, 'rgba(25, 20, 12, 0.08)');
        sg.addColorStop(1, 'rgba(25, 20, 12, 0)');
        cx.fillStyle = sg; cx.fillRect(sx - sxw / 2, 0, sxw, h);
      }
      for (var d = 0; d < 4; d++) {
        var dx = Math.random() * w;
        var dy = h * 0.7 + Math.random() * h * 0.3;
        var dr = 32 + Math.random() * 50;
        var dg2 = cx.createRadialGradient(dx, dy, 0, dx, dy, dr);
        dg2.addColorStop(0, 'rgba(70, 80, 55, 0.30)');
        dg2.addColorStop(1, 'rgba(40, 50, 40, 0)');
        cx.fillStyle = dg2; cx.fillRect(dx - dr, dy - dr, dr * 2, dr * 2);
      }
      cx.strokeStyle = 'rgba(50, 38, 22, 0.45)'; cx.lineWidth = 0.7;
      for (var ch = 0; ch < 14; ch++) {
        cx.beginPath();
        var cxh = Math.random() * w, cyh = Math.random() * h;
        cx.moveTo(cxh, cyh);
        for (var sg2 = 0; sg2 < 5; sg2++) {
          cxh += (Math.random() - 0.5) * 28; cyh += 12 + Math.random() * 22;
          cx.lineTo(cxh, cyh);
        }
        cx.stroke();
      }
      for (var pr = 0; pr < 8; pr++) {
        var prx = Math.random() * w, pry = Math.random() * h;
        var prr = 12 + Math.random() * 22;
        var pg = cx.createRadialGradient(prx, pry, 0, prx, pry, prr);
        pg.addColorStop(0, 'rgba(225, 210, 180, 0.45)');
        pg.addColorStop(0.6, 'rgba(220, 200, 170, 0.14)');
        pg.addColorStop(1, 'rgba(220, 200, 170, 0)');
        cx.fillStyle = pg;
        cx.beginPath();
        cx.ellipse(prx, pry, prr, prr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(200, 170, 130, 0.10)';
      cx.fillRect(w * 0.18, h * 0.55, w * 0.12, h * 0.10);
      cx.fillStyle = 'rgba(245, 240, 215, 0.36)';
      cx.beginPath();
      cx.ellipse(w * 0.88, h * 0.08, 5, 2.5, 0.4, 0, Math.PI * 2);
      cx.fill();
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [2, 3];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 });
  }

  // ---------- GRIMY ROAD ----------
  // Tarmac with aggregate speckle, lighter repair patches, jagged
  // cracks, wandering tar-seal sealant lines, oil blotches, faded
  // white centre line.
  function makeGrimyRoad(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x1c1c1c).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      for (var p = 0; p < 4200; p++) {
        var pg = 25 + Math.floor(Math.random() * 70);
        cx.fillStyle = 'rgba(' + pg + ',' + pg + ',' + pg + ',0.42)';
        cx.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5);
      }
      for (var rp = 0; rp < 6; rp++) {
        var rx = Math.random() * w, ry = Math.random() * h;
        var rwd = 50 + Math.random() * 100, rht = 35 + Math.random() * 70;
        cx.fillStyle = 'rgba(78, 78, 78, ' + (0.16 + Math.random() * 0.22).toFixed(3) + ')';
        cx.fillRect(rx, ry, rwd, rht);
        cx.strokeStyle = 'rgba(100, 100, 100, 0.18)'; cx.lineWidth = 0.6;
        cx.strokeRect(rx, ry, rwd, rht);
      }
      cx.strokeStyle = 'rgba(8, 8, 8, 0.8)'; cx.lineWidth = 1.2;
      for (var c = 0; c < 10; c++) {
        cx.beginPath();
        var cx0 = Math.random() * w, cy0 = Math.random() * h;
        cx.moveTo(cx0, cy0);
        var ang = Math.random() * Math.PI * 2, len = 30 + Math.random() * 80;
        cx.lineTo(cx0 + Math.cos(ang) * len, cy0 + Math.sin(ang) * len);
        cx.lineTo(cx0 + Math.cos(ang + 0.4) * len * 1.4, cy0 + Math.sin(ang + 0.4) * len * 1.4);
        cx.stroke();
      }
      cx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; cx.lineWidth = 2.6;
      for (var tm = 0; tm < 5; tm++) {
        cx.beginPath();
        var tx = Math.random() * w, ty = Math.random() * h;
        cx.moveTo(tx, ty);
        for (var ts = 0; ts < 5; ts++) {
          tx += (Math.random() - 0.5) * 30; ty += 8 + Math.random() * 16;
          cx.lineTo(tx, ty);
        }
        cx.stroke();
      }
      cx.fillStyle = 'rgba(220, 220, 200, 0.5)';
      cx.fillRect(w * 0.5 - 2, h * 0.3, 4, h * 0.4);
      cx.fillStyle = 'rgba(220, 220, 200, 0.18)';
      cx.fillRect(w * 0.5 - 2, h * 0.05, 4, h * 0.2);
      cx.fillRect(w * 0.5 - 2, h * 0.75, 4, h * 0.2);
      for (var os = 0; os < 4; os++) {
        var ox = Math.random() * w, oy = Math.random() * h;
        var orr = 8 + Math.random() * 18;
        var og = cx.createRadialGradient(ox, oy, 0, ox, oy, orr);
        og.addColorStop(0, 'rgba(0, 0, 0, 0.62)');
        og.addColorStop(0.7, 'rgba(15, 12, 5, 0.22)');
        og.addColorStop(1, 'rgba(15, 12, 5, 0)');
        cx.fillStyle = og; cx.fillRect(ox - orr, oy - orr, orr * 2, orr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [1, 8];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0.18 });
  }

  // ---------- PAVING SLABS ----------
  // London paving slabs with grout, cracks, gum/fag-ends and
  // wet patches.
  function makePavingSlabs(opts) {
    opts = opts || {};
    var base = '#' + (opts.baseColor || 0x3a3a36).toString(16).padStart(6, '0');
    var tex = makeCanvasTexture(512, 512, function(cx, w, h) {
      cx.fillStyle = base; cx.fillRect(0, 0, w, h);
      var sw = 128, sh = 96;
      cx.strokeStyle = 'rgba(18, 18, 16, 0.55)'; cx.lineWidth = 1.4;
      for (var sy = 0; sy < h; sy += sh) {
        var off = ((sy / sh) % 2 === 0) ? 0 : sw / 2;
        for (var sx = -sw; sx < w + sw; sx += sw) {
          var bxp = sx + off;
          var sg = 48 + Math.floor(Math.random() * 28);
          cx.fillStyle = 'rgba(' + sg + ',' + sg + ',' + (sg - 4) + ',' + (0.32 + Math.random() * 0.3).toFixed(3) + ')';
          cx.fillRect(bxp, sy, sw, sh);
          cx.strokeRect(bxp, sy, sw, sh);
        }
      }
      cx.strokeStyle = 'rgba(15, 15, 12, 0.55)'; cx.lineWidth = 0.9;
      for (var c2 = 0; c2 < 7; c2++) {
        cx.beginPath();
        cx.moveTo(Math.random() * w, Math.random() * h);
        cx.lineTo(Math.random() * w, Math.random() * h);
        cx.stroke();
      }
      for (var fe = 0; fe < 60; fe++) {
        cx.fillStyle = 'rgba(180, 175, 165, ' + (0.15 + Math.random() * 0.22).toFixed(3) + ')';
        cx.beginPath();
        cx.arc(Math.random() * w, Math.random() * h, 1.0 + Math.random() * 1.6, 0, Math.PI * 2);
        cx.fill();
      }
      for (var wp = 0; wp < 5; wp++) {
        var wpx = Math.random() * w, wpy = Math.random() * h;
        var wpr = 35 + Math.random() * 60;
        var wpg = cx.createRadialGradient(wpx, wpy, 0, wpx, wpy, wpr);
        wpg.addColorStop(0, 'rgba(72, 78, 80, 0.35)');
        wpg.addColorStop(1, 'rgba(72, 78, 80, 0)');
        cx.fillStyle = wpg; cx.fillRect(wpx - wpr, wpy - wpr, wpr * 2, wpr * 2);
      }
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    var r = opts.repeat || [4, 4];
    tex.repeat.set(r[0], r[1]);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.88 });
  }

  // ---------- VICTORIAN GAS LAMP ----------
  // Cast-iron stepped base, fluted shaft, mid-band, ladder rest,
  // capital, 4-sided emissive glass lantern, pyramidal cap,
  // crown finial, point light, halo + inner-core sprites.
  // Adds the lamp group to `parent` at (x, 0, z). Returns the
  // group (with `.userData.light` set to the PointLight).
  //
  // opts:
  //   intensity:   point-light intensity (default 0.5)
  //   distance:    point-light range (default 10)
  //   lampColor:   point-light + glow colour (default 0xffd6a0)
  //   haloScale:   outer halo sprite size (default 2.2)
  //   coreScale:   inner-core sprite size (default 0.9)
  //   paneColor:   solid emissive pane colour (default 0xfff0c8)
  function createVictorianGasLamp(parent, x, z, opts) {
    opts = opts || {};
    var lampColor = opts.lampColor || 0xffd6a0;
    var paneColor = opts.paneColor || 0xfff0c8;
    var g = new THREE.Group();
    var castIron = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.78, metalness: 0.22 });
    var darkIron = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.7, metalness: 0.3 });
    var brassish = new THREE.MeshStandardMaterial({ color: 0x6a4a1a, roughness: 0.6, metalness: 0.35 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); g.add(m); return m;
    }
    // Stepped base
    place(new THREE.CylinderGeometry(0.24, 0.28, 0.10, 16), castIron, 0, 0.05, 0);
    place(new THREE.CylinderGeometry(0.20, 0.24, 0.18, 16), castIron, 0, 0.19, 0);
    place(new THREE.CylinderGeometry(0.17, 0.20, 0.05, 16), darkIron, 0, 0.31, 0);
    place(new THREE.BoxGeometry(0.32, 0.32, 0.32), castIron, 0, 0.50, 0);
    place(new THREE.CylinderGeometry(0.11, 0.16, 0.06, 16), darkIron, 0, 0.69, 0);
    // Shaft
    place(new THREE.CylinderGeometry(0.058, 0.10, 3.9, 16), castIron, 0, 2.65, 0);
    // Mid-band
    place(new THREE.CylinderGeometry(0.082, 0.082, 0.06, 16), darkIron, 0, 1.55, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.58, 0);
    place(new THREE.CylinderGeometry(0.090, 0.090, 0.02, 16), darkIron, 0, 1.52, 0);
    // Ladder rest
    place(new THREE.BoxGeometry(0.52, 0.018, 0.018), castIron, 0, 4.45, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.52), castIron, 0, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron,  0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, -0.26, 4.45, 0);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45,  0.26);
    place(new THREE.SphereGeometry(0.024, 6, 4), castIron, 0, 4.45, -0.26);
    // Capital
    place(new THREE.CylinderGeometry(0.085, 0.062, 0.08, 16), castIron, 0, 4.66, 0);
    place(new THREE.CylinderGeometry(0.105, 0.085, 0.04, 16), darkIron, 0, 4.72, 0);
    place(new THREE.CylinderGeometry(0.045, 0.045, 0.14, 12), castIron, 0, 4.81, 0);
    // Lantern base + 4 emissive panes
    place(new THREE.BoxGeometry(0.34, 0.04, 0.34), darkIron, 0, 4.91, 0);
    var paneMat = new THREE.MeshBasicMaterial({ color: paneColor });
    var paneF = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneF.position.set(0, 5.16, 0.134); g.add(paneF);
    var paneB = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneB.position.set(0, 5.16, -0.134); paneB.rotation.y = Math.PI; g.add(paneB);
    var paneL = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneL.position.set(-0.134, 5.16, 0); paneL.rotation.y = Math.PI / 2; g.add(paneL);
    var paneR = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.40), paneMat);
    paneR.position.set(0.134, 5.16, 0); paneR.rotation.y = -Math.PI / 2; g.add(paneR);
    // Corner posts + cross-bars
    var corners = [[0.135, 0.135], [-0.135, 0.135], [0.135, -0.135], [-0.135, -0.135]];
    for (var cp = 0; cp < 4; cp++) {
      place(new THREE.BoxGeometry(0.028, 0.44, 0.028), darkIron, corners[cp][0], 5.16, corners[cp][1]);
    }
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16,  0.135);
    place(new THREE.BoxGeometry(0.28, 0.018, 0.018), darkIron, 0, 5.16, -0.135);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.28), darkIron,  0.135, 5.16, 0);
    place(new THREE.BoxGeometry(0.018, 0.018, 0.28), darkIron, -0.135, 5.16, 0);
    // Top plate + pyramidal cap
    place(new THREE.BoxGeometry(0.36, 0.045, 0.36), darkIron, 0, 5.40, 0);
    var cap = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.20, 4), castIron);
    cap.position.set(0, 5.52, 0); cap.rotation.y = Math.PI / 4; g.add(cap);
    // Crown finial
    place(new THREE.SphereGeometry(0.034, 8, 6), darkIron, 0, 5.66, 0);
    place(new THREE.CylinderGeometry(0.008, 0.008, 0.12, 8), darkIron, 0, 5.74, 0);
    place(new THREE.SphereGeometry(0.018, 6, 4), brassish,  0, 5.82, 0);
    // Point light
    var light = new THREE.PointLight(lampColor, opts.intensity != null ? opts.intensity : 0.5, opts.distance != null ? opts.distance : 10);
    light.position.set(0, 5.16, 0); light.castShadow = true; g.add(light);
    // Halo sprite
    var glowTex = makeCanvasTexture(128, 128, function(cx, w, h) {
      var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      grad.addColorStop(0, 'rgba(255, 220, 150, 0.85)');
      grad.addColorStop(0.25, 'rgba(255, 200, 110, 0.40)');
      grad.addColorStop(0.6, 'rgba(220, 160, 70, 0.08)');
      grad.addColorStop(1, 'rgba(180, 120, 50, 0)');
      cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    });
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0.7 }));
    halo.position.set(0, 5.16, 0);
    var hs = opts.haloScale || 2.2;
    halo.scale.set(hs, hs, 1); g.add(halo);
    // Inner core
    var coreTex = makeCanvasTexture(64, 64, function(cx, w, h) {
      var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      grad.addColorStop(0, 'rgba(255, 245, 200, 1)');
      grad.addColorStop(0.3, 'rgba(255, 220, 140, 0.55)');
      grad.addColorStop(1, 'rgba(255, 200, 110, 0)');
      cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    });
    var core = new THREE.Sprite(new THREE.SpriteMaterial({ map: coreTex, transparent: true, opacity: 0.9 }));
    core.position.set(0, 5.16, 0);
    var cs = opts.coreScale || 0.9;
    core.scale.set(cs, cs, 1); g.add(core);
    g.position.set(x, 0, z); g.userData.light = light;
    parent.add(g); return g;
  }

  // ---------- HOODED SHOP LAMP ----------
  // Bracket-out + downward-cone hood + bulb + warm point light.
  // Adds to `parent` at the given world position.
  function createHoodedShopLamp(parent, x, y, z, opts) {
    opts = opts || {};
    var body = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.5 });
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); parent.add(m); return m;
    }
    // Bracket
    place(new THREE.BoxGeometry(0.04, 0.04, 0.32), body, x, y, z);
    // Hood
    var hood = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.10, 0.16, 12), body);
    hood.position.set(x, y - 0.10, z + 0.16); parent.add(hood);
    // Bulb
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xfff0c8 }));
    bulb.position.set(x, y - 0.22, z + 0.16); parent.add(bulb);
    // Light
    var light = new THREE.PointLight(opts.lightColor || 0xffe5a0,
      opts.intensity != null ? opts.intensity : 0.45,
      opts.distance != null ? opts.distance : 4);
    light.position.set(x, y - 0.4, z + 0.19);
    parent.add(light);
    return { hood: hood, bulb: bulb, light: light };
  }

  // ---------- ENTER BUTTON (Ginger-Light style) ----------
  // Standard approach button: transparent dark fill, coloured
  // text + border, fades in, hover brightens.
  // Returns the DOM element. Caller appends + wires onclick.
  function createEnterButton(label, opts) {
    opts = opts || {};
    var color = opts.color || '232,180,80';
    var hover = opts.hoverColor || '255,210,120';
    var fadeIn = opts.fadeInMs != null ? opts.fadeInMs : 1800;
    var btn = document.createElement('div');
    btn.textContent = label;
    btn.style.cssText = [
      'position:fixed', 'bottom:60px', 'left:50%', 'transform:translateX(-50%)',
      'font:13px "Courier New",monospace',
      'color:rgba(' + color + ',0.85)',
      'letter-spacing:4px', 'cursor:pointer', 'padding:12px 28px',
      'border:1px solid rgba(' + color + ',0.3)',
      'background:rgba(0,0,0,0.4)',
      'z-index:9004', 'white-space:nowrap',
      'opacity:0', 'transition:opacity 1.5s ease, color 0.3s ease, border-color 0.3s ease'
    ].join(';');
    setTimeout(function() { btn.style.opacity = '1'; }, fadeIn);
    btn.addEventListener('mouseenter', function() {
      this.style.color = 'rgba(' + hover + ',0.95)';
      this.style.borderColor = 'rgba(' + color + ',0.6)';
    });
    btn.addEventListener('mouseleave', function() {
      this.style.color = 'rgba(' + color + ',0.85)';
      this.style.borderColor = 'rgba(' + color + ',0.3)';
    });
    return btn;
  }

  // ---------- UV FLY-KILLER ----------
  // Grey casing + slatted grille + bright additive-blended violet
  // UV tube + bluish halo sprite. Adds parts to `parent` centred
  // at (x, y, z). Returns { casing, light }.
  function createFlyKiller(parent, x, y, z, opts) {
    opts = opts || {};
    function place(geo, mat, px, py, pz) {
      var m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); parent.add(m); return m;
    }
    // Casing
    var casing = place(new THREE.BoxGeometry(0.85, 0.32, 0.10),
      new THREE.MeshStandardMaterial({ color: 0x2a2a2c, roughness: 0.65, metalness: 0.25 }),
      x, y, z);
    // Grille slats
    for (var fk = 0; fk < 5; fk++) {
      place(new THREE.BoxGeometry(0.78, 0.018, 0.015),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.7, metalness: 0.3 }),
        x, y - 0.11 + fk * 0.06, z + 0.05);
    }
    // UV tube (additive)
    var tubeMat = new THREE.MeshBasicMaterial({
      color: 0x6a90ff, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 1.0, depthWrite: false
    });
    var tube = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.18), tubeMat);
    tube.position.set(x, y, z + 0.07); parent.add(tube);
    // Inner core
    var coreMat = new THREE.MeshBasicMaterial({
      color: 0xcad8ff, blending: THREE.AdditiveBlending,
      transparent: true, opacity: 1.0, depthWrite: false
    });
    var core = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.06), coreMat);
    core.position.set(x, y, z + 0.08); parent.add(core);
    // Halo
    var haloTex = makeCanvasTexture(64, 64, function(cx, w, h) {
      var grad = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
      grad.addColorStop(0, 'rgba(120, 160, 255, 0.95)');
      grad.addColorStop(0.4, 'rgba(80, 120, 255, 0.35)');
      grad.addColorStop(1, 'rgba(60, 100, 255, 0)');
      cx.fillStyle = grad; cx.fillRect(0, 0, w, h);
    });
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex, transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    halo.position.set(x, y, z + 0.09); halo.scale.set(1.3, 0.5, 1); parent.add(halo);
    // Light spill
    var light = new THREE.PointLight(0x4060ff,
      opts.intensity != null ? opts.intensity : 0.55,
      opts.distance != null ? opts.distance : 3.5);
    light.position.set(x, y - 0.15, z - 0.1); parent.add(light);
    return { casing: casing, light: light };
  }

  // ---------- DRESSED WINDOW ----------
  // Painted room seen through an upper-storey window: lamp-lit or dark,
  // dressed with side drapes (style 0), a half-drawn roller blind (1),
  // or net curtains (2). Returns a MeshBasicMaterial ready for a plane.
  var DRESSED_CURTAIN_COLS = ['#7a2c22', '#5a5a30', '#6a4a5a', '#3a4a58'];
  function makeDressedWindow(lit, style, colIdx) {
    var tex = makeCanvasTexture(128, 192, function(cx, w, h) {
      if (lit) {
        var bgg = cx.createLinearGradient(0, 0, 0, h);
        bgg.addColorStop(0, '#c89448'); bgg.addColorStop(0.5, '#a87434'); bgg.addColorStop(1, '#6a4820');
        cx.fillStyle = bgg; cx.fillRect(0, 0, w, h);
        var cg = cx.createRadialGradient(w * 0.5, h * 0.16, 4, w * 0.5, h * 0.2, w * 0.55);
        cg.addColorStop(0, 'rgba(255, 235, 180, 0.9)');
        cg.addColorStop(1, 'rgba(255, 220, 150, 0)');
        cx.fillStyle = cg;
        cx.beginPath(); cx.arc(w * 0.5, h * 0.18, w * 0.55, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = 'rgba(85, 55, 22, 0.55)';
        cx.fillRect(w * 0.4, h * 0.44, w * 0.2, h * 0.13);
        cx.strokeStyle = 'rgba(200, 170, 90, 0.5)'; cx.lineWidth = 2;
        cx.strokeRect(w * 0.4, h * 0.44, w * 0.2, h * 0.13);
        var fsh = cx.createLinearGradient(0, h * 0.7, 0, h);
        fsh.addColorStop(0, 'rgba(40, 24, 8, 0)');
        fsh.addColorStop(1, 'rgba(40, 24, 8, 0.55)');
        cx.fillStyle = fsh; cx.fillRect(0, 0, w, h);
      } else {
        var bgd = cx.createLinearGradient(0, 0, 0, h);
        bgd.addColorStop(0, '#232c3e'); bgd.addColorStop(1, '#131a26');
        cx.fillStyle = bgd; cx.fillRect(0, 0, w, h);
        cx.fillStyle = 'rgba(150, 160, 180, 0.07)';
        cx.beginPath();
        cx.moveTo(w * 0.55, 0); cx.lineTo(w * 0.8, 0);
        cx.lineTo(w * 0.35, h); cx.lineTo(w * 0.1, h);
        cx.closePath(); cx.fill();
      }
      if (style === 1) {
        cx.fillStyle = lit ? '#c8b890' : '#39404e';
        cx.fillRect(3, 0, w - 6, h * 0.38);
        cx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        cx.fillRect(3, h * 0.365, w - 6, 3.5);
        cx.strokeStyle = 'rgba(40, 30, 15, 0.7)'; cx.lineWidth = 1.5;
        cx.beginPath(); cx.moveTo(w / 2, h * 0.38); cx.lineTo(w / 2, h * 0.43); cx.stroke();
        cx.beginPath(); cx.arc(w / 2, h * 0.45, 3, 0, Math.PI * 2); cx.stroke();
      }
      if (style === 2) {
        cx.fillStyle = 'rgba(235, 233, 222, 0.3)';
        cx.fillRect(0, 0, w, h * 0.88);
        for (var nv = 0; nv < w; nv += 9) {
          cx.fillStyle = 'rgba(255, 255, 250, ' + (0.05 + (nv % 27 === 0 ? 0.08 : 0)) + ')';
          cx.fillRect(nv, 0, 4, h * 0.88);
        }
        cx.fillStyle = 'rgba(235, 233, 222, 0.35)';
        for (var sc2 = 0; sc2 < 4; sc2++) {
          cx.beginPath();
          cx.arc(w * (0.125 + sc2 * 0.25), h * 0.88, w * 0.125, 0, Math.PI);
          cx.fill();
        }
      } else {
        var dCol = lit ? DRESSED_CURTAIN_COLS[(colIdx || 0) % DRESSED_CURTAIN_COLS.length] : '#1e1a22';
        var drawDrape = function() {
          cx.fillStyle = dCol;
          cx.beginPath();
          cx.moveTo(0, 0);
          cx.lineTo(w * 0.32, 0);
          cx.quadraticCurveTo(w * 0.2, h * 0.3, w * 0.15, h * 0.55);
          cx.quadraticCurveTo(w * 0.19, h * 0.72, w * 0.27, h * 0.92);
          cx.lineTo(0, h * 0.95);
          cx.closePath(); cx.fill();
          cx.strokeStyle = 'rgba(0, 0, 0, 0.3)'; cx.lineWidth = 2.5;
          for (var fl2 = 0; fl2 < 3; fl2++) {
            cx.beginPath();
            cx.moveTo(w * (0.06 + fl2 * 0.08), 4);
            cx.quadraticCurveTo(w * (0.03 + fl2 * 0.06), h * 0.4, w * (0.05 + fl2 * 0.07), h * 0.88);
            cx.stroke();
          }
          cx.strokeStyle = 'rgba(255, 240, 210, ' + (lit ? 0.25 : 0.06) + ')'; cx.lineWidth = 1.5;
          cx.beginPath();
          cx.moveTo(w * 0.29, 4);
          cx.quadraticCurveTo(w * 0.17, h * 0.32, w * 0.13, h * 0.55);
          cx.stroke();
        };
        drawDrape();
        cx.save(); cx.translate(w, 0); cx.scale(-1, 1); drawDrape(); cx.restore();
        cx.fillStyle = lit ? 'rgba(40, 20, 12, 0.9)' : 'rgba(10, 8, 12, 0.9)';
        cx.fillRect(0, 0, w, 7);
      }
    });
    return new THREE.MeshBasicMaterial({ map: tex });
  }

  return {
    makeCanvasTexture: makeCanvasTexture,
    makeGrimyBrick: makeGrimyBrick,
    makeWeatheredStucco: makeWeatheredStucco,
    makeGrimyRoad: makeGrimyRoad,
    makePavingSlabs: makePavingSlabs,
    makeDressedWindow: makeDressedWindow,
    createVictorianGasLamp: createVictorianGasLamp,
    createHoodedShopLamp: createHoodedShopLamp,
    createEnterButton: createEnterButton,
    createFlyKiller: createFlyKiller
  };
})();
</script>
<script>
// ============================================================
// FAGIN'S DEN — Field Lane, Saffron Hill (v2)
// Wider, moodier, dirtier. Individual chairs, a moth-eaten
// chesterfield by the fire, guttering candles on mantel and
// table, moonlight through a hole in the roof, and a tawdry
// cuckoo clock on the chimney breast.
// Built on the dssScene toolkit (grimy brick, weathered
// stucco, paving, canvas-texture helper).
// ============================================================

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
scene.fog = new THREE.Fog(0x060504, 3.6, 11.5);

var camera = new THREE.PerspectiveCamera(63, window.innerWidth / window.innerHeight, 0.1, 100);
var CAM = { x: 1.15, y: 1.45, z: 1.95, tx: -3.3, ty: 0.9, tz: -0.45 };
camera.position.set(CAM.x, CAM.y, CAM.z);
camera.lookAt(CAM.tx, CAM.ty, CAM.tz);

var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Filmic pipeline: ACES tone curve + sRGB output. Linear output with no tone
// curve is the single biggest "2007" tell.
// Linear output: under EffectComposer the GammaCorrection pass owns the
// sRGB conversion; leaving the renderer on sRGB double-corrects and washes out.
renderer.outputEncoding = THREE.LinearEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Film grade overlays: vignette + animated grain
var vignette = document.createElement('div');
vignette.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:5;' +
  'background:radial-gradient(ellipse at 50% 46%, transparent 38%, rgba(0,0,0,0.38) 72%, rgba(0,0,0,0.78) 100%);';
document.body.appendChild(vignette);
var grainCanvas = document.createElement('canvas');
grainCanvas.width = 128; grainCanvas.height = 128;
var gcx = grainCanvas.getContext('2d');
var gd = gcx.createImageData(128, 128);
for (var gi = 0; gi < gd.data.length; gi += 4) {
  var gv = 118 + Math.floor(Math.random() * 20);
  gd.data[gi] = gd.data[gi + 1] = gd.data[gi + 2] = gv;
  gd.data[gi + 3] = 255;
}
gcx.putImageData(gd, 0, 0);
var grain = document.createElement('div');
grain.style.cssText = 'position:fixed;inset:-128px;pointer-events:none;z-index:6;' +
  'background:url(' + grainCanvas.toDataURL() + ');opacity:0.045;mix-blend-mode:overlay;';
document.body.appendChild(grain);

// ---------- POST-PROCESSING: bloom + depth of field ----------
var composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
var bokehPass = new THREE.BokehPass(scene, camera, {
  focus: 3.4,            // the table plane; fireplace falls gently soft
  aperture: 0.0009,
  maxblur: 0.0065,
  width: window.innerWidth,
  height: window.innerHeight
});
composer.addPass(bokehPass);
var bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.26, 0.5, 0.8);
composer.addPass(bloomPass);
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

// ---------- procedural WOOD materials (den-specific; toolkit has no wood) ----------

function makeFloorboards(opts) {
  opts = opts || {};
  var tex = dssScene.makeCanvasTexture(512, 512, function(cx, w, h) {
    cx.fillStyle = '#2e2216'; cx.fillRect(0, 0, w, h);
    var pW = 42;
    for (var py = 0; py < h; py += pW) {
      var seed = Math.random();
      var r = 44 + Math.floor(seed * 26), g = 32 + Math.floor(seed * 17), b = 20 + Math.floor(seed * 10);
      cx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      cx.fillRect(0, py + 1, w, pW - 2);
      for (var gr = 0; gr < 14; gr++) {
        cx.strokeStyle = 'rgba(24, 15, 8, ' + (0.12 + Math.random() * 0.24).toFixed(3) + ')';
        cx.lineWidth = 0.8 + Math.random() * 1.4;
        cx.beginPath();
        var gy = py + 3 + Math.random() * (pW - 6);
        cx.moveTo(0, gy);
        cx.bezierCurveTo(w * 0.3, gy + (Math.random() - 0.5) * 7, w * 0.7, gy + (Math.random() - 0.5) * 7, w, gy);
        cx.stroke();
      }
      var joint = Math.random() * w;
      cx.fillStyle = 'rgba(10, 6, 3, 0.85)';
      cx.fillRect(joint, py + 1, 2, pW - 2);
      cx.fillStyle = 'rgba(16, 12, 9, 0.9)';
      cx.beginPath(); cx.arc(joint + 8, py + pW * 0.3, 1.6, 0, Math.PI * 2); cx.fill();
      cx.beginPath(); cx.arc(joint + 8, py + pW * 0.7, 1.6, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = 'rgba(4, 2, 1, 0.9)';
      cx.fillRect(0, py + pW - 1.5, w, 1.5);
    }
    // heavy grime: spilled stains, tracked dirt, soot wash
    for (var wp = 0; wp < 32; wp++) {
      var wx = Math.random() * w, wy = Math.random() * h, wr = 30 + Math.random() * 90;
      var wg = cx.createRadialGradient(wx, wy, 0, wx, wy, wr);
      var dark = Math.random() > 0.3;
      var tone = dark ? '8, 5, 3' : '150, 130, 95';
      wg.addColorStop(0, 'rgba(' + tone + ', ' + (dark ? 0.3 : 0.07) + ')');
      wg.addColorStop(1, 'rgba(' + tone + ', 0)');
      cx.fillStyle = wg; cx.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
    }
    // candle-grease spots
    for (var gs = 0; gs < 8; gs++) {
      cx.fillStyle = 'rgba(190, 175, 140, ' + (0.06 + Math.random() * 0.08).toFixed(3) + ')';
      cx.beginPath();
      cx.ellipse(Math.random() * w, Math.random() * h, 2 + Math.random() * 5, 2 + Math.random() * 4, 0, 0, Math.PI * 2);
      cx.fill();
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  var rep = opts.repeat || [2, 2];
  tex.repeat.set(rep[0], rep[1]);
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0.02 });
}

function makeAgedBeam(opts) {
  opts = opts || {};
  var baseHex = opts.baseColor != null ? opts.baseColor : 0x2c1f16;
  var base = '#' + baseHex.toString(16).padStart(6, '0');
  var tex = dssScene.makeCanvasTexture(512, 512, function(cx, w, h) {
    cx.fillStyle = base; cx.fillRect(0, 0, w, h);
    for (var gr = 0; gr < 48; gr++) {
      cx.strokeStyle = 'rgba(12, 7, 4, ' + (0.14 + Math.random() * 0.26).toFixed(3) + ')';
      cx.lineWidth = 0.7 + Math.random() * 2.0;
      var gy = Math.random() * h;
      cx.beginPath(); cx.moveTo(0, gy);
      cx.bezierCurveTo(w * 0.35, gy + (Math.random() - 0.5) * 9, w * 0.65, gy + (Math.random() - 0.5) * 9, w, gy + (Math.random() - 0.5) * 5);
      cx.stroke();
    }
    // knots with growth rings around them
    for (var kn = 0; kn < 4; kn++) {
      var kx = Math.random() * w, ky = Math.random() * h;
      for (var ring = 6; ring > 0; ring--) {
        cx.strokeStyle = 'rgba(14, 8, 4, ' + (0.2 + ring * 0.05).toFixed(2) + ')';
        cx.lineWidth = 1 + Math.random();
        cx.beginPath();
        cx.ellipse(kx, ky, ring * 3.2 + Math.random() * 2, ring * 1.9 + Math.random(), 0.3, 0, Math.PI * 2);
        cx.stroke();
      }
      cx.fillStyle = 'rgba(8, 4, 2, 0.85)';
      cx.beginPath(); cx.ellipse(kx, ky, 3.4, 2.4, 0.3, 0, Math.PI * 2); cx.fill();
      // grain deflects around the knot
      cx.strokeStyle = 'rgba(20, 12, 6, 0.3)'; cx.lineWidth = 1.2;
      cx.beginPath(); cx.ellipse(kx, ky, 26, 14, 0.3, 0, Math.PI * 2); cx.stroke();
    }

function hewGeo(geo, amp) {
  var pos = geo.attributes.position;

    var dd = seen[key];
    pos.setXYZ(i, pos.getX(i) + dd[0], pos.getY(i) + dd[1], pos.getZ(i) + dd[2]);
  }

// Embroidered silk texture: weave, stitched border, corner flowers, grime.
function makeSilkTexture(col, mono) {
  var r = (col >> 16) & 255, g = (col >> 8) & 255, b = col & 255;
  var lr = Math.min(255, r + 22), lg = Math.min(255, g + 19), lb = Math.min(255, b + 16);
  var thread = 'rgba(226, 204, 158, ';   // pale gold embroidery thread
  var tex = dssScene.makeCanvasTexture(256, 256, function(cx, w, h) {
    cx.fillStyle = 'rgb(' + lr + ',' + lg + ',' + lb + ')';
    cx.fillRect(0, 0, w, h);
    // weave: fine crosshatch
    cx.strokeStyle = 'rgba(0,0,0,0.05)'; cx.lineWidth = 1;
    for (var wv = 0; wv < w; wv += 3) {
      cx.beginPath(); cx.moveTo(wv, 0); cx.lineTo(wv, h); cx.stroke();
      cx.beginPath(); cx.moveTo(0, wv); cx.lineTo(w, wv); cx.stroke();
    }
    // soft cloth shading: darker toward the gathered top, faint edge AO
    var sh = cx.createLinearGradient(0, 0, 0, h);
    sh.addColorStop(0, 'rgba(0,0,0,0.22)');
    sh.addColorStop(0.3, 'rgba(0,0,0,0.04)');
    sh.addColorStop(1, 'rgba(0,0,0,0.10)');
    cx.fillStyle = sh; cx.fillRect(0, 0, w, h);
    // stitched double border
    cx.setLineDash([5, 4]);
    cx.strokeStyle = thread + '0.85)'; cx.lineWidth = 2.2;
    cx.strokeRect(16, 16, w - 32, h - 32);
    cx.strokeStyle = thread + '0.55)'; cx.lineWidth = 1.4;
    cx.strokeRect(26, 26, w - 52, h - 52);
    cx.setLineDash([]);
    // scalloped hem stitches along the bottom border
    cx.strokeStyle = thread + '0.7)'; cx.lineWidth = 1.6;
    for (var sc = 24; sc < w - 24; sc += 16) {
      cx.beginPath(); cx.arc(sc + 8, h - 20, 8, Math.PI, 0); cx.stroke();
    }
    // corner flowers: five petal dots + centre
    [[38, 38], [w - 38, 38], [38, h - 38], [w - 38, h - 38]].forEach(function(pt) {
      for (var pe = 0; pe < 5; pe++) {
        var pa = pe * Math.PI * 2 / 5 - Math.PI / 2;
        cx.fillStyle = thread + '0.8)';
        cx.beginPath();
        cx.ellipse(pt[0] + Math.cos(pa) * 7, pt[1] + Math.sin(pa) * 7, 3.4, 2.2, pa, 0, Math.PI * 2);
        cx.fill();
      }
      cx.fillStyle = 'rgba(180, 130, 90, 0.9)';
      cx.beginPath(); cx.arc(pt[0], pt[1], 2.6, 0, Math.PI * 2); cx.fill();
    });
    // stitched monogram in the middle — every silk had an owner once
    cx.save();
    cx.translate(w / 2, h / 2);
    cx.rotate((Math.random() - 0.5) * 0.18);
    cx.font = 'italic 44px Georgia, serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillStyle = thread + '0.14)';
    cx.fillText(mono, 0, 2);
    cx.setLineDash([3, 2.5]);
    cx.strokeStyle = thread + '0.85)';
    cx.lineWidth = 1.7;
    cx.strokeText(mono, 0, 2);
    cx.setLineDash([]);
    cx.restore();
    // grime: it has been in pockets and gutters
    for (var gm = 0; gm < 3; gm++) {
      var gx = Math.random() * w, gy = Math.random() * h, gr2 = 12 + Math.random() * 26;
      var gg = cx.createRadialGradient(gx, gy, 0, gx, gy, gr2);
      gg.addColorStop(0, 'rgba(30, 22, 12, 0.10)');
      gg.addColorStop(1, 'rgba(30, 22, 12, 0)');
      cx.fillStyle = gg; cx.fillRect(gx - gr2, gy - gr2, gr2 * 2, gr2 * 2);
    }
  });
  return tex;
}

// Draped silk geometry: pinched at the peg, widening and rippling to the hem.
function makeSilkGeometry(hw, hh, seed) {
  var geo = new THREE.PlaneGeometry(hw, hh, 8, 10);
  var pos = geo.attributes.position;
  var twist = (seed % 2 ? 1 : -1) * (0.4 + (seed % 5) * 0.12);
  var ripplePh = seed * 1.7;
  for (var vi = 0; vi < pos.count; vi++) {
    var vx = pos.getX(vi), vy = pos.getY(vi);
    var yd = (hh / 2 - vy) / hh;                    // 0 at peg, 1 at hem
    var spread = 0.5 + 0.5 * Math.min(1, yd * 1.7); // gathered top, full hem
    var nx = vx / hw;                                // -0.5..0.5
    pos.setX(vi, vx * spread);
    // belly outward plus ripples that grow toward the hem
    var z = 0.014 * Math.sin(Math.PI * yd)
          + 0.011 * Math.sin((nx + 0.5) * Math.PI * 3 + ripplePh) * yd
          + nx * 0.028 * yd * twist;
    pos.setZ(vi, z);
    // hem corners droop a little lower than the middle
    pos.setY(vi, vy - 0.02 * Math.abs(nx) * 2 * yd);
  }
  geo.computeVertexNormals();
  geo.userData.basePos = pos.array.slice();
  geo.userData.hh = hh;
  return geo;
}

// Fur: short directional strokes in a circular flow (the curl), over a base
// coat; optional cow dapples with fuzzed edges. Doubles as bump.
function makeFurTex(baseCol, darkStroke, lightStroke, dappled) {
  var tex = dssScene.makeCanvasTexture(256, 256, function(cx, w, h) {
    cx.fillStyle = baseCol; cx.fillRect(0, 0, w, h);
    if (dappled) {
      for (var bp = 0; bp < 5; bp++) {
        var px = Math.random() * w, py = Math.random() * h;
        for (var sub = 0; sub < 4; sub++) {
          cx.fillStyle = 'rgba(19, 18, 21, 0.97)';
          cx.beginPath();
          cx.ellipse(px + (Math.random() - 0.5) * 40, py + (Math.random() - 0.5) * 30,
            16 + Math.random() * 26, 12 + Math.random() * 20, Math.random() * 3, 0, Math.PI * 2);
          cx.fill();
        }
        // fuzzed patch edges: short strokes across the boundary
        for (var fz = 0; fz < 26; fz++) {
          var fa = Math.random() * Math.PI * 2;
          var fr2 = 30 + Math.random() * 18;
          cx.strokeStyle = Math.random() > 0.5 ? 'rgba(19,18,21,0.7)' : baseCol.replace(')', ',0.7)').replace('rgb', 'rgba');
          cx.lineWidth = 1 + Math.random();
          cx.beginPath();
          cx.moveTo(px + Math.cos(fa) * fr2, py + Math.sin(fa) * fr2);
          cx.lineTo(px + Math.cos(fa) * (fr2 + 5 + Math.random() * 5), py + Math.sin(fa) * (fr2 + 5));
          cx.stroke();
        }
      }
    }
    // directional fur: strokes following a circular flow around the centre
    for (var f = 0; f < 750; f++) {
      var fx = Math.random() * w, fy = Math.random() * h;
      var ang = Math.atan2(fy - h / 2, fx - w / 2) + Math.PI / 2 + (Math.random() - 0.5) * 0.5;
      var len = 4 + Math.random() * 7;
      var light = Math.random() > 0.72;
      cx.strokeStyle = (light ? lightStroke : darkStroke) + (0.05 + Math.random() * 0.13).toFixed(2) + ')';
      cx.lineWidth = 0.7 + Math.random() * 0.9;
      cx.beginPath();
      cx.moveTo(fx, fy);
      cx.quadraticCurveTo(fx + Math.cos(ang) * len * 0.5, fy + Math.sin(ang) * len * 0.5 + 1,
        fx + Math.cos(ang) * len, fy + Math.sin(ang) * len);
      cx.stroke();
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeWoolTex(hex) {
  var base = '#' + hex.toString(16).padStart(6, '0');
  var tex = dssScene.makeCanvasTexture(128, 128, function(cx, w, h) {
    cx.fillStyle = base; cx.fillRect(0, 0, w, h);
    // coarse weave
    cx.strokeStyle = 'rgba(0,0,0,0.14)'; cx.lineWidth = 1;
    for (var wv = 0; wv < w; wv += 3) {
      cx.beginPath(); cx.moveTo(wv, 0); cx.lineTo(wv, h); cx.stroke();
      cx.beginPath(); cx.moveTo(0, wv); cx.lineTo(w, wv); cx.stroke();
    }
    // worn-pale patches and grime
    for (var wp2 = 0; wp2 < 6; wp2++) {
      var wx3 = Math.random() * w, wy3 = Math.random() * h, wr4 = 8 + Math.random() * 20;
      var wg3 = cx.createRadialGradient(wx3, wy3, 0, wx3, wy3, wr4);
      var pale2 = Math.random() > 0.5;
      wg3.addColorStop(0, pale2 ? 'rgba(180,165,140,0.14)' : 'rgba(8,5,3,0.22)');
      wg3.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = wg3; cx.fillRect(wx3 - wr4, wy3 - wr4, wr4 * 2, wr4 * 2);
    }
    // a darned patch with stitch border
    var px2 = 20 + Math.random() * (w - 60), py2 = 20 + Math.random() * (h - 60);
    cx.fillStyle = 'rgba(120, 105, 80, 0.55)';
    cx.fillRect(px2, py2, 26, 20);
    cx.setLineDash([2.5, 2]);
    cx.strokeStyle = 'rgba(190, 170, 130, 0.7)'; cx.lineWidth = 1.2;
    cx.strokeRect(px2, py2, 26, 20);
    cx.setLineDash([]);
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  var mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.96, metalness: 0 });
  mat.bumpMap = tex;
  mat.bumpScale = 0.015;
  return mat;
}

function makeBedroll(x, z, yaw, opts) {
  opts = opts || {};
  var g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = yaw;
  var sc = opts.scale || 1;
  if (opts.straw) {
    for (var st2 = 0; st2 < 3; st2++) {
      var straw = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), strawHeapMat);
      straw.scale.set((1.5 + Math.random() * 0.5) * sc, 0.22, (0.9 + Math.random() * 0.3) * sc);
      straw.position.set((Math.random() - 0.5) * 0.25, 0.028, (Math.random() - 0.5) * 0.18);
      straw.rotation.y = (Math.random() - 0.5) * 0.6;
      g.add(straw);
    }
  }
  var wool = woolMats[opts.mat || 0];
  var blanket = new THREE.Mesh(hewGeo(new THREE.SphereGeometry(0.5, 14, 11), 0.035), wool);
  blanket.scale.set(1.05 * sc, opts.straw ? 0.2 : 0.12, 0.7 * sc);
  blanket.position.y = opts.straw ? 0.1 : 0.045;
  blanket.rotation.y = (Math.random() - 0.5) * 0.2;
  g.add(blanket);
  // folded-back corner
  var flap = new THREE.Mesh(hewGeo(new THREE.BoxGeometry(0.26, 0.014, 0.2), 0.012), wool);
  flap.position.set(0.32 * sc, (opts.straw ? 0.14 : 0.07), 0.16 * sc);
  flap.rotation.y = 0.5;
  flap.rotation.z = -0.08;
  g.add(flap);
  if (opts.bundle) {
    var bun = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), bundleMat);
    bun.scale.set(0.85, 0.5, 0.62);
    bun.position.set(-0.42 * sc, 0.065, -0.05);
    bun.rotation.y = 0.4;
    g.add(bun);
  }
  var cs = contactShadow(scene, 0, 0, 0.42);
  cs.position.set(x, 0.0058, z);
  cs.scale.set(1.7 * sc, sc, 1);
  cs.rotation.z = -yaw;
  scene.add(g);
  if (opts.occupied) occupiedRolls.push({ g: blanket, ph: Math.random() * 6, amp: 0.05 });
  return g;
}

// ---------- THE OWL (tawny, on the tie beam, left) ----------
function makeFeatherMat(baseHex) {
  var tex = dssScene.makeCanvasTexture(128, 128, function(cx, w, h) {
    cx.fillStyle = baseHex; cx.fillRect(0, 0, w, h);
    // tawny streaking: dark vertical dashes over rufous ground
    for (var st = 0; st < 90; st++) {
      cx.strokeStyle = 'rgba(40, 24, 12, ' + (0.25 + Math.random() * 0.35).toFixed(2) + ')';
      cx.lineWidth = 1 + Math.random() * 2;
      var fx = Math.random() * w, fy = Math.random() * h;
      cx.beginPath(); cx.moveTo(fx, fy);
      cx.lineTo(fx + (Math.random() - 0.5) * 4, fy + 5 + Math.random() * 9); cx.stroke();
    }
    // pale mottled flecks
    for (var fl = 0; fl < 55; fl++) {
      cx.fillStyle = 'rgba(196, 168, 128, ' + (0.15 + Math.random() * 0.25).toFixed(2) + ')';
      cx.beginPath();
      cx.ellipse(Math.random() * w, Math.random() * h, 1.5 + Math.random() * 2.5, 1 + Math.random() * 1.6, 0, 0, Math.PI * 2);
      cx.fill();
    }
  });
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 });
}
var owl = new THREE.Group();

[-1, 1].forEach(function(sd) {

// animation state
var owlNextGlance = 2, owlHeadTarget = 0, owlHeadCur = 0;
var owlPupilTx = 0, owlPupilTy = 0, owlPupilX = 0, owlPupilY = 0;
var owlNextRuffle = 6, owlRuffleStart = -1;

// eaves wedges: darkness gathering where the roof dives to meet the walls
var aoEdgeTex = dssScene.makeCanvasTexture(64, 64, function(cx, w, h) {

});
var aoEdgeMat = new THREE.MeshBasicMaterial({ map: aoEdgeTex, transparent: true, depthWrite: false });
// near slope
var thN = Math.PI / 2 + slopeAng;
var nearEaveAO = new THREE.Mesh(new THREE.PlaneGeometry(HX * 2, 1.1), aoEdgeMat);
nearEaveAO.rotation.x = thN;
nearEaveAO.position.set(0, (EAVE + RIDGE) / 2, HZ / 2)
  .add(new THREE.Vector3(0, Math.cos(thN), Math.sin(thN)).multiplyScalar(SL / 2 - 0.55))
  .add(new THREE.Vector3(0, -Math.sin(thN), Math.cos(thN)).multiplyScalar(0.02));
nearEaveAO.userData.noShadow = true;

// far slope (child of the deck group, sits just inside it)

farEaveAO.position.set(0, -SL / 2 + 0.55, 0.02);
farEaveAO.userData.noShadow = true;
farDeck.add(farEaveAO);
// corner columns: soft pooled dark in the wall corners
var cornerMat = new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false, opacity: 0.7 });
[[-HX + 0.015, 1.0, HZ - 0.4, Math.PI / 2], [-HX + 0.015, 1.0, -(HZ - 0.4), Math.PI / 2],
 [HX - 0.015, 1.0, HZ - 0.4, -Math.PI / 2], [HX - 0.015, 1.0, -(HZ - 0.4), -Math.PI / 2]].forEach(function(cc) {
  var col = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 2.4), cornerMat);
  col.position.set(cc[0], cc[1], cc[2]);
  col.rotation.y = cc[3];
  col.userData.noShadow = true;
  scene.add(col);
});

// ---------- SHADOW FLAGS + MATERIAL FINISH PASS ----------
// Procedural environment for image-based lighting: a dim warm room with a
// fire-glow to one side and cold moonlight to the other. Gives every
// standard material real specular life instead of dead diffuse.
var envCanvas = document.createElement('canvas');
envCanvas.width = 256; envCanvas.height = 128;
var ecx = envCanvas.getContext('2d');
var eg = ecx.createLinearGradient(0, 0, 0, 128);
eg.addColorStop(0, '#0b0805');
eg.addColorStop(0.45, '#2a180a');
eg.addColorStop(0.75, '#1c1108');
eg.addColorStop(1, '#0e0905');
ecx.fillStyle = eg; ecx.fillRect(0, 0, 256, 128);
var fireBlob = ecx.createRadialGradient(48, 84, 2, 48, 84, 46);
fireBlob.addColorStop(0, 'rgba(255,140,40,0.9)');
fireBlob.addColorStop(1, 'rgba(255,140,40,0)');
ecx.fillStyle = fireBlob; ecx.fillRect(0, 0, 256, 128);
var moonBlob = ecx.createRadialGradient(176, 36, 2, 176, 36, 30);
moonBlob.addColorStop(0, 'rgba(140,170,220,0.55)');
moonBlob.addColorStop(1, 'rgba(140,170,220,0)');
ecx.fillStyle = moonBlob; ecx.fillRect(0, 0, 256, 128);
var envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
envTex.encoding = THREE.sRGBEncoding;
var pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envTex).texture;

var maxAniso = renderer.capabilities.getMaxAnisotropy();
scene.traverse(function(o) {
  if (!o.isMesh) return;
  if (!o.userData.noShadow) {
    o.castShadow = true;
    o.receiveShadow = true;
  }
  var mats = Array.isArray(o.material) ? o.material : [o.material];
  mats.forEach(function(m) {
    if (!m) return;
    if (m.map) {
      m.map.encoding = THREE.sRGBEncoding;         // correct colour under sRGB output
      m.map.anisotropy = maxAniso;                 // sharp textures at grazing angles
    }
    if (m.isMeshStandardMaterial) {
      if (!(m.userData && m.userData.keepEnv)) m.envMapIntensity = 0.3;
      if (m.map && !m.bumpMap) {                   // micro-relief from the same canvas
        m.bumpMap = m.map;
        m.bumpScale = 0.018;
      }
    }
    m.needsUpdate = true;
  });
});
// heavier relief where it earns it
plankMats.forEach(function(m) { m.bumpScale = 0.05; m.roughness = 0.85; });
pierBrick.bumpScale = 0.03;
upperBrick.bumpScale = 0.03;
stackBrick.bumpScale = 0.026;
beamMat.bumpScale = 0.04;
darkBeamMat.bumpScale = 0.04;
woodMat.bumpScale = 0.035;
// the ceiling must never read as painted: kill its sheen and reflection
roofDeckMat.bumpScale = 0.012;
roofDeckMat.roughness = 0.98;
roofDeckMat.envMapIntensity = 0.07;
[gableMatA, gableMatB, eaveMat].forEach(function(m) { m.envMapIntensity = 0.12; m.roughness = 0.97; });

// ---------- RENDER LOOP ----------
var t = 0, frameN = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;
  var fl = 1.5 + Math.sin(t * 8.3) * 0.16 + Math.sin(t * 23.7) * 0.09 + (Math.random() - 0.5) * 0.14;
  fireLight.intensity = fl;
  fireGlow.material.opacity = 0.5 + fl * 0.18;
  mouthGlow.material.opacity = 0.5 + fl * 0.18;
  for (var ff = 0; ff < hearthFlames.length; ff++) {
    var hfa = hearthFlames[ff];
    var fsc = 0.85 + Math.sin(t * 9 + hfa.ph) * 0.16 + (Math.random() - 0.5) * 0.1;
    hfa.sp.scale.set(hfa.w * fsc, hfa.h * (0.8 + Math.sin(t * 13.5 + hfa.ph * 2) * 0.25 + (Math.random() - 0.5) * 0.08), 1);
    hfa.sp.material.opacity = 0.62 + Math.sin(t * 11 + hfa.ph) * 0.18 + fl * 0.12;
    hfa.sp.position.z = hfa.z + Math.sin(t * 5 + hfa.ph) * 0.012;
  }
  // guttering: each flame has a slow swell that occasionally collapses
  var mantelSum = 0, tableSum = 0;
  for (var ci = 0; ci < candles.length; ci++) {
    var c = candles[ci];
    var gut = Math.max(0.15, Math.min(1, Math.sin(t * 0.55 + c.phase * 2.1) * 1.6 + 0.75));
    var flick = 0.75 + Math.sin(t * 12 + c.phase) * 0.15 + (Math.random() - 0.5) * 0.18;
    var s = gut * flick;
    c.flame.scale.set(0.06 * (0.75 + s * 0.4), 0.14 * (0.55 + s * 0.65), 1);
    c.flame.material.opacity = 0.35 + s * 0.6;
    if (ci < 3) mantelSum += s; else tableSum += s;
  }
  mantelLight.intensity = 0.16 + (mantelSum / 3) * 0.5;
  tableLight.intensity = 0.14 + (tableSum / 3) * 0.5;
  // cloth flutter: travelling waves through the silk, strongest at the hem,
  // with occasional gusts — pinned at the peg, never bellying like a sail
  for (var hi = 0; hi < hankMeshes.length; hi++) {
    var hm = hankMeshes[hi];
    hm.mesh.rotation.y = hm.baseRy + Math.sin(t * 1.1 + hm.phase) * 0.045;
    var hgeo = hm.mesh.geometry;
    var hposA = hgeo.attributes.position;
    var hbase = hgeo.userData.basePos;
    var hhh = hgeo.userData.hh;
    var gust = Math.pow(Math.max(0, Math.sin(t * 0.23 + hm.phase * 2.7)), 2);
    var amp = 0.007 + gust * 0.018;
    for (var vi2 = 0; vi2 < hposA.count; vi2++) {
      var bx2 = hbase[vi2 * 3], by2 = hbase[vi2 * 3 + 1], bz2 = hbase[vi2 * 3 + 2];
      var yd2 = Math.min(1, Math.max(0, (hhh / 2 - by2) / hhh));
      hposA.setZ(vi2, bz2
        + amp * Math.sin(t * 5.2 + bx2 * 9 + hm.phase * 3) * Math.pow(yd2, 1.6)
        + amp * 0.5 * Math.sin(t * 8.3 + bx2 * 14 + hm.phase) * Math.pow(yd2, 2.2));
    }
    hposA.needsUpdate = true;
    hgeo.computeVertexNormals();
  }
  pend.rotation.z = Math.sin(t * 3.4) * 0.4;
  // the cats breathe in their sleep
  for (var sc2 = 0; sc2 < sleepingCats.length; sc2++) {
    var slc = sleepingCats[sc2];
    if (slc.slow) {
      slc.g.scale.y = slc.baseY * (1 + 0.06 * Math.sin(t * 0.9 + slc.ph));
    } else {
      var cb = slc.base || 1;
      slc.g.scale.set(cb, cb * (1 + 0.022 * Math.sin(t * 1.5 + slc.ph)), cb);
    }
  }
  // the owl glances about: quick head turns, pupil shifts
  if (t > owlNextGlance) {
    owlNextGlance = t + 1.8 + Math.random() * 3.5;
    owlHeadTarget = (Math.random() - 0.5) * 1.2;
    owlPupilTx = (Math.random() - 0.5) * 0.011;
    owlPupilTy = (Math.random() - 0.5) * 0.006;
  }
  owlHeadCur += (owlHeadTarget - owlHeadCur) * 0.14;
  owlHead.rotation.y = owlHeadCur;
  owlPupilX += (owlPupilTx - owlPupilX) * 0.2;
  owlPupilY += (owlPupilTy - owlPupilY) * 0.2;
  for (var oi = 0; oi < owlPupils.length; oi++) {
    owlPupils[oi].p.position.x = owlPupils[oi].bx + owlPupilX;
    owlPupils[oi].p.position.y = owlPupils[oi].by + owlPupilY;
  }
  // and sometimes ruffles its wings
  if (t > owlNextRuffle) { owlNextRuffle = t + 7 + Math.random() * 10; owlRuffleStart = t; }
  if (owlRuffleStart > 0) {
    var rt = (t - owlRuffleStart) / 0.85;
    if (rt >= 1) {
      owlRuffleStart = -1;
      owlWings[0].g.rotation.z = 0.1; owlWings[1].g.rotation.z = -0.1;
      owlBody.scale.set(0.9, 1.35, 0.85);
      owl.rotation.z = 0;
    } else {
      var env = Math.sin(Math.PI * rt);
      var flut = 0.5 + Math.sin(t * 52) * 0.5;
      owlWings[0].g.rotation.z = 0.1 + env * (0.4 + 0.3 * flut);
      owlWings[1].g.rotation.z = -0.1 - env * (0.4 + 0.3 * flut);
      owlBody.scale.set(0.9 + env * 0.07, 1.35 - env * 0.04, 0.85 + env * 0.07);
      owl.rotation.z = env * Math.sin(t * 38) * 0.025;
    }
  }
  // dust settles down the beam, with a slow sideways breathe
  var mp = moteGeo.attributes.position.array;
  for (var di = 0; di < moteCount; di++) {
    var md = moteSeed[di];
    mp[di * 3 + 1] -= md.sp * 0.016;
    if (mp[di * 3 + 1] < -beamLen / 2) mp[di * 3 + 1] = beamLen / 2;
    var wob = md.r + Math.sin(t * 0.5 + md.ph) * 0.02;
    mp[di * 3]     = Math.cos(md.a + t * 0.05) * wob;
    mp[di * 3 + 2] = Math.sin(md.a + t * 0.05) * wob;
  }
  moteGeo.attributes.position.needsUpdate = true;
  // smoke climbs and thins, re-forming low
  for (var si = 0; si < smokes.length; si++) {
    var sk = smokes[si];
    var cyc = (t * 0.05 + sk.ph) % 1;
    sk.sp.position.set(sk.x + Math.sin(t * 0.3 + sk.ph) * 0.15, sk.y + cyc * 0.9, sk.z);
    sk.sp.material.opacity = sk.base * (1 - cyc * 0.8);
  }
  camera.position.x = CAM.x + Math.sin(t * 0.1) * 0.08;
  camera.position.y = CAM.y + Math.sin(t * 0.16) * 0.035;
  camera.lookAt(CAM.tx, CAM.ty, CAM.tz);
  if ((frameN = (frameN || 0) + 1) % 3 === 0) {
    grain.style.transform = 'translate(' + (Math.random() * 96 | 0) + 'px,' + (Math.random() * 96 | 0) + 'px)';
  }
  composer.render();
}
animate();

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>
